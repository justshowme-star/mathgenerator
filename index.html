<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classroom Screen</title>
<style>
:root{
  --bg1:#e8eef3; --bg2:#dde7ee; --card:rgba(255,255,255,.65); --text:#2c3e50; --muted:#6b7f90; --accent:#4f7ea8; --bar:#c9d8e4;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){--bg1:#1f2a33;--bg2:#1a232b;--card:rgba(255,255,255,.07);--text:#e6edf2;--muted:#93a4b3;--accent:#7aa7cc;--bar:#33424e}
}
:root[data-theme="mist"]{--bg1:#e8eef3;--bg2:#dde7ee;--card:rgba(255,255,255,.65);--text:#2c3e50;--muted:#6b7f90;--accent:#4f7ea8;--bar:#c9d8e4}
:root[data-theme="sage"]{--bg1:#e9efe7;--bg2:#dfe8dc;--card:rgba(255,255,255,.62);--text:#2f3e33;--muted:#6f8372;--accent:#5d8a66;--bar:#cdddca}
:root[data-theme="sand"]{--bg1:#f1ece3;--bg2:#e9e2d5;--card:rgba(255,255,255,.62);--text:#3d3a33;--muted:#8a8372;--accent:#a07f4f;--bar:#ddd4c2}
:root[data-theme="night"]{--bg1:#1f2a33;--bg2:#1a232b;--card:rgba(255,255,255,.07);--text:#e6edf2;--muted:#93a4b3;--accent:#7aa7cc;--bar:#33424e}
*{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;display:flex;flex-direction:column;padding:2vmin;gap:2vmin;transition:background .4s}
.row{display:grid;grid-template-columns:1fr 1fr;gap:2vmin}
.card{background:var(--card);border-radius:2.2vmin;padding:2.5vmin 3vmin;display:flex;flex-direction:column;justify-content:center;min-width:0}
.label{font-size:max(1.6vmin,13px);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:1vmin}
#time{font-size:clamp(48px,15vmin,200px);font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
#time small{font-size:.32em;margin-left:.2em;color:var(--muted);font-weight:400}
#date{font-size:clamp(16px,3.4vmin,44px);color:var(--muted);margin-top:1.2vmin}
#tdisp{font-size:clamp(48px,15vmin,200px);font-weight:300;line-height:1;font-variant-numeric:tabular-nums;text-align:left}
#tdisp.done{color:var(--accent);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.prog{height:1.2vmin;min-height:6px;background:var(--bar);border-radius:99px;margin:1.6vmin 0;overflow:hidden}
.prog i{display:block;height:100%;width:100%;background:var(--accent);transition:width .5s linear}
.tctl{display:flex;flex-wrap:wrap;gap:1vmin;align-items:center}
button,select,input{font:inherit;color:var(--text)}
button{background:var(--bar);border:0;border-radius:1.2vmin;padding:.8vmin 1.6vmin;font-size:max(2vmin,14px);cursor:pointer}
button:hover{filter:brightness(.95)}
button.primary{background:var(--accent);color:#fff}
.tctl input{width:5.5ch;text-align:center;background:transparent;border:2px solid var(--bar);border-radius:1.2vmin;padding:.7vmin;font-size:max(2vmin,14px)}
#ann{flex:1;min-height:0;overflow:auto}
#annTitle{font-size:clamp(20px,4.4vmin,60px);font-weight:600;outline:none;margin-bottom:1.2vmin}
#annBody{font-size:var(--af,5vmin);line-height:1.35;outline:none;white-space:pre-wrap;flex:1}
[contenteditable]:empty::before{content:attr(data-ph);color:var(--muted)}
[contenteditable]:focus{box-shadow:0 0 0 2px var(--bar);border-radius:6px}
#bar{display:flex;flex-wrap:wrap;gap:1vmin;align-items:center;justify-content:flex-end;opacity:.45;transition:opacity .3s}
#bar:hover,#bar:focus-within{opacity:1}
body.clean #bar{opacity:0;pointer-events:none}
.dot{width:3vmin;min-width:20px;height:3vmin;min-height:20px;border-radius:50%;border:2px solid var(--bar);padding:0}
@media (max-width:700px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="row">
  <div class="card">
    <div class="label">Time</div>
    <div id="time">--:--</div>
    <div id="date"></div>
  </div>
  <div class="card">
    <div class="label">Timer</div>
    <div id="tdisp">05:00</div>
    <div class="prog"><i id="pbar"></i></div>
    <div class="tctl">
      <button id="minus" aria-label="Subtract a minute">−1</button>
      <input id="mins" type="number" min="0" max="180" value="5" aria-label="Minutes">
      <span>min</span>
      <button id="plus" aria-label="Add a minute">+1</button>
      <button class="primary" id="go">Start</button>
      <button id="reset">Reset</button>
      <button data-p="1">1</button><button data-p="5">5</button><button data-p="10">10</button><button data-p="15">15</button>
    </div>
  </div>
</div>
<div class="card" id="ann">
  <div id="annTitle" contenteditable="true" spellcheck="false" data-ph="Announcements">Today</div>
  <div id="annBody" contenteditable="true" spellcheck="false" data-ph="Click here to type an announcement…"></div>
</div>
<div id="bar">
  <button id="fm" title="Smaller text">A−</button>
  <button id="fp" title="Larger text">A+</button>
  <button class="dot" data-t="mist" style="background:#dde7ee" title="Mist"></button>
  <button class="dot" data-t="sage" style="background:#dfe8dc" title="Sage"></button>
  <button class="dot" data-t="sand" style="background:#e9e2d5" title="Sand"></button>
  <button class="dot" data-t="night" style="background:#1f2a33" title="Night"></button>
  <button id="clean" title="Hide these controls (press H to toggle)">Hide controls</button>
  <button id="full">Full screen</button>
</div>
<script>
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem('cs_'+k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem('cs_'+k,v)}catch(e){}}};

/* Clock (12-hour) */
function tick(){
  const n=new Date();
  let h=n.getHours(),m=n.getMinutes(),ap=h>=12?'PM':'AM';
  h=h%12||12;
  $('time').innerHTML=h+':'+String(m).padStart(2,'0')+'<small>'+ap+'</small>';
  $('date').textContent=n.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
}
tick(); setInterval(tick,1000);

/* Timer */
let total=Math.max(0,parseInt(store.get('mins','5'))||5)*60, left=total, end=0, iv=null;
$('mins').value=total/60;
function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function draw(){
  $('tdisp').textContent=fmt(left);
  $('pbar').style.width=(total?Math.max(0,left/total)*100:0)+'%';
  $('tdisp').classList.toggle('done',total>0&&left<=0);
  if(total>0&&left<=0&&!iv)$('tdisp').textContent="Time’s up";
}
function setMins(v){
  stop(); v=Math.min(180,Math.max(0,Math.round(v)||0));
  total=v*60; left=total; $('mins').value=v; store.set('mins',v); draw();
}
function stop(){clearInterval(iv);iv=null;$('go').textContent='Start'}
function chime(){
  try{
    const c=new (window.AudioContext||window.webkitAudioContext)();
    [0,.5,1].forEach((t,i)=>{
      const o=c.createOscillator(),g=c.createGain();
      o.type='sine';o.frequency.value=[523,659,784][i];
      g.gain.setValueAtTime(0,c.currentTime+t);
      g.gain.linearRampToValueAtTime(.25,c.currentTime+t+.05);
      g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+1.4);
      o.connect(g);g.connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+1.5);
    });
  }catch(e){}
}
function run(){
  if(iv){left=Math.max(0,(end-Date.now())/1000);stop();draw();return}
  if(left<=0)left=total;
  if(left<=0)return;
  end=Date.now()+left*1000;
  $('go').textContent='Pause';
  iv=setInterval(()=>{
    left=(end-Date.now())/1000;
    if(left<=0){left=0;stop();chime()}
    draw();
  },200);
  draw();
}
$('go').onclick=run;
$('reset').onclick=()=>setMins(total/60);
$('plus').onclick=()=>setMins(total/60+1);
$('minus').onclick=()=>setMins(total/60-1);
$('mins').onchange=e=>setMins(parseFloat(e.target.value));
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>setMins(+b.dataset.p));
draw();

/* Announcement (saved in this browser) */
$('annTitle').textContent=store.get('title','Today');
$('annBody').textContent=store.get('body','');
$('annTitle').oninput=()=>store.set('title',$('annTitle').textContent);
$('annBody').oninput=()=>store.set('body',$('annBody').innerText);
let af=parseFloat(store.get('af','5'));
function setAf(v){af=Math.min(12,Math.max(2,v));document.documentElement.style.setProperty('--af',af+'vmin');store.set('af',af)}
setAf(af);
$('fp').onclick=()=>setAf(af+.6); $('fm').onclick=()=>setAf(af-.6);

/* Theme, controls, fullscreen */
const th=store.get('theme','');
if(th)document.documentElement.dataset.theme=th;
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{document.documentElement.dataset.theme=b.dataset.t;store.set('theme',b.dataset.t)});
$('clean').onclick=()=>document.body.classList.add('clean');
addEventListener('keydown',e=>{
  if(e.target.isContentEditable||e.target.tagName==='INPUT')return;
  if(e.key==='h'||e.key==='H')document.body.classList.toggle('clean');
  if(e.key===' '){e.preventDefault();run()}
});
$('full').onclick=()=>{
  try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}
};
</script>
</body>
</html>
