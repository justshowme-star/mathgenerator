<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coordinate Grid with Labeled Lines</title>
<style>
:root{--bg:#eef2f6;--panel:#fff;--ink:#14202e;--mute:#5b6b7c;--line:#cfd8e2;--accent:#1f5fbf;--bad:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--panel:#17212c;--ink:#e6edf4;--mute:#93a3b4;--line:#2b3948;--accent:#6aa3f0;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#0f1720;--panel:#17212c;--ink:#e6edf4;--mute:#93a3b4;--line:#2b3948;--accent:#6aa3f0;--bad:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:minmax(300px,390px) 1fr;gap:16px;padding:16px;max-width:1400px;margin:0 auto}
@media(max-width:860px){.app{grid-template-columns:1fr}}
aside,.stage{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
h1{font-size:19px;margin:0 0 2px}h2{font-size:14px;margin:18px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.sub,.hint{color:var(--mute);font-size:13px;margin:0 0 6px}
input,select,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 7px;min-width:0}
input[type=color]{padding:1px;width:38px;height:30px}input[type=range]{padding:0;width:100%}input[type=checkbox]{width:auto}
button{cursor:pointer}button:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bad{border-color:var(--bad)}
.row{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;display:grid;gap:6px}
.l1{display:flex;gap:6px}.l1 .eq{flex:1;font-family:ui-monospace,Menlo,Consolas,monospace}
.l2,.l3{display:flex;gap:6px;align-items:center}.l2{flex-wrap:wrap}.l2 .chk{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--mute)}.l3 input{flex:1}
.l4{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;align-items:center;font-size:13px;color:var(--mute)}
.l4 label{display:flex;gap:6px;align-items:center}.l4 label:first-child{grid-column:1/-1;flex-direction:column;align-items:stretch;gap:2px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 8px}
.grid3 label,.f label{display:grid;gap:2px;font-size:13px;color:var(--mute)}
.f{display:grid;gap:8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
.bar button{background:var(--accent);color:#fff;border-color:var(--accent)}
.stage{position:sticky;top:16px;align-self:start}
@media(max-width:860px){.stage{position:static}}
.wrap{overflow:auto;background:#fff;border-radius:6px;border:1px solid var(--line)}
#fig{display:block;max-width:100%;height:auto;margin:0 auto}
#note{color:var(--mute);font-size:13px;min-height:1.4em;margin-top:8px}
@media print{body{background:#fff}aside,.bar,#note{display:none}.app{display:block;padding:0}.stage{border:0;padding:0;position:static}.wrap{border:0}}
</style>
</head>
<body>
<div class="app">
<aside id="panel">
  <h1>Coordinate grid</h1>
  <p class="sub">Graph lines and points, then label them wherever you want.</p>
  <h2 style="border:0;padding:0">Equations and points</h2>
  <p class="hint">Try y = 2x + 1, 2x + 3y = 6, x = 4, y = x^2 − 4, y = 3sin(2x), or points like A(2, 3), B(−1, 4).</p>
  <div id="rows"></div>
  <button type="button" id="add">Add row</button>

  <h2>Titles</h2>
  <div class="f">
    <label>Chart title<input id="ct"></label>
    <label>x-axis title<input id="xt"></label>
    <label>y-axis title<input id="yt"></label>
  </div>

  <h2>x-axis</h2>
  <div class="grid3">
    <label>From<input id="x0" value="-10"></label>
    <label>To<input id="x1" value="10"></label>
    <label>Count by<input id="xs" value="1"></label>
    <label>Numbers<select id="xn"><option value="1">Every line</option><option value="2">Every 2nd</option><option value="5">Every 5th</option><option value="10">Every 10th</option><option value="0">None</option></select></label>
    <label>Axis label<input id="xl" value="x"></label>
  </div>

  <h2>y-axis</h2>
  <div class="grid3">
    <label>From<input id="y0" value="-10"></label>
    <label>To<input id="y1" value="10"></label>
    <label>Count by<input id="ys" value="1"></label>
    <label>Numbers<select id="yn"><option value="1">Every line</option><option value="2">Every 2nd</option><option value="5">Every 5th</option><option value="10">Every 10th</option><option value="0">None</option></select></label>
    <label>Axis label<input id="yl" value="y"></label>
  </div>
  <p class="hint">Ranges accept fractions and pi, like pi/2.</p>

  <h2>Grid and text</h2>
  <div class="grid3">
    <label>Gridlines<select id="gw"><option value="light">Light</option><option value="standard" selected>Standard</option><option value="bold">Bold</option><option value="none">None</option></select></label>
    <label>Minor lines<select id="gm"><option value="1">None</option><option value="2">2 per block</option><option value="4">4 per block</option><option value="5">5 per block</option></select></label>
    <label>Block size<input id="cell" type="range" min="16" max="60" value="28"></label>
    <label>Label size<input id="ls" type="range" min="11" max="26" value="15"></label>
  </div>
</aside>

<main class="stage">
  <div class="bar">
    <button type="button" id="dsvg">Save SVG</button>
    <button type="button" id="dpng">Save PNG</button>
    <button type="button" id="cpy">Copy image</button>
    <button type="button" id="prt">Print</button>
  </div>
  <div class="wrap"><svg id="fig"></svg></div>
  <div id="note" role="status"></div>
</main>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>{n=+n.toFixed(6);if(Object.is(n,-0))n=0;return(n<0?'\u2212':'')+Math.abs(n)};
const FN={sin:Math.sin,cos:Math.cos,tan:Math.tan,sec:x=>1/Math.cos(x),csc:x=>1/Math.sin(x),cot:x=>1/Math.tan(x),arcsin:Math.asin,arccos:Math.acos,arctan:Math.atan,ln:Math.log,log:Math.log10,sqrt:Math.sqrt,abs:Math.abs};
const NAMES=['arcsin','arccos','arctan','sqrt','sin','cos','tan','sec','csc','cot','abs','ln','log','pi','x','y','e'];

function compile(src){
  const t=src.replace(/[\u2212\u2013]/g,'-').replace(/\u03c0/g,'pi').replace(/\s+/g,'').toLowerCase().replace(/\*\*/g,'^');
  let i=0,abs=0;const pk=()=>t[i];
  const expr=()=>{let v=term();while(pk()=='+'||pk()=='-'){const o=t[i++],l=v,r=term();v=o=='+'?(x,y)=>l(x,y)+r(x,y):(x,y)=>l(x,y)-r(x,y)}return v};
  const term=()=>{let v=unary();while(i<t.length&&(pk()=='*'||pk()=='/'||/[0-9.a-z(]/.test(pk())||(pk()=='|'&&!abs))){let o='*';if(pk()=='*'||pk()=='/')o=t[i++];const l=v,r=unary();v=o=='*'?(x,y)=>l(x,y)*r(x,y):(x,y)=>l(x,y)/r(x,y)}return v};
  const unary=()=>{if(pk()=='-'){i++;const f=unary();return(x,y)=>-f(x,y)}if(pk()=='+'){i++;return unary()}return power()};
  const power=()=>{const b=prim();if(pk()=='^'){i++;const e=unary();return(x,y)=>Math.pow(b(x,y),e(x,y))}return b};
  const prim=()=>{
    const rest=t.slice(i);let m=rest.match(/^\d*\.?\d+/);
    if(m){i+=m[0].length;const n=+m[0];return()=>n}
    if(pk()=='('){i++;const v=expr();if(pk()!=')')throw 0;i++;return v}
    if(pk()=='|'){i++;abs++;const v=expr();if(pk()!='|')throw 0;i++;abs--;return(x,y)=>Math.abs(v(x,y))}
    m=rest.match(/^log_(\d*\.?\d+)/);
    if(m){i+=m[0].length;const b=Math.log(+m[1]),a=pk()=='('?prim():power();return(x,y)=>Math.log(a(x,y))/b}
    const nm=NAMES.find(n=>rest.startsWith(n));if(!nm)throw 0;i+=nm.length;
    if(FN[nm]){const f=FN[nm],a=pk()=='('?prim():power();return(x,y)=>f(a(x,y))}
    if(nm=='x')return x=>x;if(nm=='y')return(x,y)=>y;
    const c=nm=='pi'?Math.PI:Math.E;return()=>c};
  const f=expr();if(i<t.length)throw 0;return f}

function parseRow(s){
  s=s.replace(/[\u2212\u2013]/g,'-').trim();if(!s)return null;
  const pre=/([A-Za-z]'*)?\s*\(\s*(-?\d*\.?\d+)\s*,\s*(-?\d*\.?\d+)\s*\)/g;
  const pts=[...s.matchAll(pre)];
  if(pts.length&&s.replace(pre,'').replace(/[\s,]/g,'')==='')return{type:'pts',pts:pts.map(m=>({n:m[1]||'',x:+m[2],y:+m[3]}))};
  const parts=s.split('=');if(parts.length>2)throw 0;
  let g;
  if(parts.length==1){const f=compile(parts[0]);g=(x,y)=>y-f(x,y)}
  else{const a=compile(parts[0]),b=compile(parts[1]);g=(x,y)=>a(x,y)-b(x,y)}
  const dy=g(.5,1)-g(.5,0);if(!isFinite(dy))throw 0;
  if(dy===0){const a=g(0,0),b=g(1,0)-a;if(!isFinite(a)||!b)throw 0;return{type:'v',c:-a/b}}
  return{type:'f',f:x=>{const a=g(x,0);return -a/(g(x,1)-a)}}}

const COLORS=['#1f5fbf','#d1342f','#1a8a4a','#7a3fb0','#d97706','#0e7490'];
let rows=[{eq:'y = 2x + 1',color:COLORS[0],dash:'solid',w:'2.5',lab:'y = 2x + 1',pos:78,place:'above',rot:true,coords:false,arr:'both',vis:true,labOn:true}];
const sel=(o,v)=>o.map(([a,b])=>`<option value="${a}"${a==v?' selected':''}>${b}</option>`).join('');

function renderRows(){
  const box=$('#rows');box.innerHTML='';
  rows.forEach((r,i)=>{
    const d=document.createElement('div');d.className='row';d.dataset.i=i;
    d.innerHTML=`<div class="l1"><input class="eq" data-k="eq" value="${esc(r.eq)}" placeholder="y = 2x + 1   or   A(2, 3)" aria-label="Equation or points"><button type="button" data-act="del" aria-label="Remove row" title="Remove row">\u00d7</button></div>
<div class="l2"><input type="color" data-k="color" value="${r.color}" aria-label="Color"><select data-k="dash" aria-label="Line style">${sel([['solid','Solid'],['dashed','Dashed'],['dotted','Dotted']],r.dash)}</select><select data-k="w" aria-label="Thickness">${sel([['1.5','Thin'],['2.5','Medium'],['4','Thick']],r.w)}</select><select data-k="arr" aria-label="Arrows">${sel([['both','Arrows: both ends'],['start','Arrow: left/bottom end'],['end','Arrow: right/top end'],['none','No arrows']],r.arr||'both')}</select><label class="chk"><input type="checkbox" data-k="vis"${r.vis!==false?' checked':''}>Show</label></div>
<div class="l3"><input data-k="lab" value="${esc(r.lab)}" placeholder="Label (for points: A; B; C)" aria-label="Line label"><button type="button" data-act="useeq">Use equation</button></div>
<div class="l4"><label>Position along line<input type="range" data-k="pos" min="0" max="100" value="${r.pos}"></label><select data-k="place" aria-label="Label placement">${sel([['above','Above line'],['below','Below line'],['on','On the line'],['right','Right of point'],['left','Left of point']],r.place)}</select><label><input type="checkbox" data-k="rot"${r.rot?' checked':''}>Tilt with line</label><label><input type="checkbox" data-k="coords"${r.coords?' checked':''}>Show point coordinates</label><label><input type="checkbox" data-k="labOn"${r.labOn!==false?' checked':''}>Show label</label></div>`;
    box.append(d)})}
$('#rows').addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;const r=rows[e.target.closest('.row').dataset.i];r[k]=e.target.type=='checkbox'?e.target.checked:e.target.value;draw()});
$('#rows').addEventListener('click',e=>{const a=e.target.dataset.act;if(!a)return;const i=+e.target.closest('.row').dataset.i;
  if(a=='del')rows.splice(i,1);
  if(a=='useeq')rows[i].lab=rows[i].eq.replace(/\s+/g,' ').trim();
  renderRows();draw()});
$('#add').onclick=()=>{rows.push({eq:'',color:COLORS[rows.length%COLORS.length],dash:'solid',w:'2.5',lab:'',pos:70,place:'above',rot:true,coords:false,arr:'both',vis:true,labOn:true});renderRows();draw();const q=document.querySelectorAll('.eq');q[q.length-1].focus()};

function draw(){
  const val=id=>{try{return compile($('#'+id).value)(0,0)}catch(e){return NaN}};
  const x0=val('x0'),x1=val('x1'),xs=val('xs'),y0=val('y0'),y1=val('y1'),ys=val('ys');
  const fig=$('#fig');
  if(![x0,x1,xs,y0,y1,ys].every(isFinite)||x1<=x0||y1<=y0||xs<=0||ys<=0||(x1-x0)/xs>200||(y1-y0)/ys>200){$('#note').textContent='Check the axis ranges: \u201cTo\u201d must be larger than \u201cFrom\u201d, and \u201cCount by\u201d must be positive.';return}
  $('#note').textContent='';
  const cell=+$('#cell').value,ls=+$('#ls').value,ct=$('#ct').value,xt=$('#xt').value,yt=$('#yt').value;
  const W=(x1-x0)/xs*cell,H=(y1-y0)/ys*cell,L=xt||yt?64:56,R=36,T=ct?58:34,B=xt?64:44;
  const TW=Math.round(L+W+R),TH=Math.round(T+H+B);
  const sx=x=>L+(x-x0)/(x1-x0)*W,sy=y=>T+H-(y-y0)/(y1-y0)*H;
  let s=`<svg id="fig" xmlns="http://www.w3.org/2000/svg" width="${TW}" height="${TH}" viewBox="0 0 ${TW} ${TH}" font-family="Helvetica,Arial,sans-serif"><rect width="100%" height="100%" fill="#fff"/><defs><clipPath id="cp"><rect x="${L}" y="${T}" width="${W}" height="${H}"/></clipPath></defs>`;
  // grid
  const gc={light:['#d5dae0',.7],standard:['#9ba6b2',1],bold:['#4a5560',1.6]}[$('#gw').value],mn=+$('#gm').value;
  if(gc){
    const ln=(a,b,c,d,w,o)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${gc[0]}" stroke-width="${w}" opacity="${o}"/>`;
    if(mn>1){for(let i=0;x0+i*xs/mn<=x1+1e-9;i++)if(i%mn)s+=ln(sx(x0+i*xs/mn),T,sx(x0+i*xs/mn),T+H,gc[1]*.5,.7);
             for(let i=0;y0+i*ys/mn<=y1+1e-9;i++)if(i%mn)s+=ln(L,sy(y0+i*ys/mn),L+W,sy(y0+i*ys/mn),gc[1]*.5,.7)}
    for(let i=0;x0+i*xs<=x1+1e-9;i++)s+=ln(sx(x0+i*xs),T,sx(x0+i*xs),T+H,gc[1],1);
    for(let i=0;y0+i*ys<=y1+1e-9;i++)s+=ln(L,sy(y0+i*ys),L+W,sy(y0+i*ys),gc[1],1)}
  // axes
  const ax=y0<=0&&y1>=0?sy(0):T+H,ay=x0<=0&&x1>=0?sx(0):L;
  s+=`<g stroke="#111" stroke-width="1.8"><line x1="${L-6}" y1="${ax}" x2="${L+W+6}" y2="${ax}"/><line x1="${ay}" y1="${T-6}" x2="${ay}" y2="${T+H+6}"/></g><g fill="#111">`
    +`<polygon points="${L+W+15},${ax} ${L+W+5},${ax-4.5} ${L+W+5},${ax+4.5}"/><polygon points="${L-15},${ax} ${L-5},${ax-4.5} ${L-5},${ax+4.5}"/>`
    +`<polygon points="${ay},${T-15} ${ay-4.5},${T-5} ${ay+4.5},${T-5}"/><polygon points="${ay},${T+H+15} ${ay-4.5},${T+H+5} ${ay+4.5},${T+H+5}"/></g>`;
  // numbers
  const xe=+$('#xn').value,ye=+$('#yn').value,orig=x0<=0&&x1>=0&&y0<=0&&y1>=0;
  s+=`<g font-size="12" fill="#111">`;
  if(xe)for(let i=0;x0+i*xs<=x1+1e-9;i++){if(i%xe)continue;const v=x0+i*xs;if(Math.abs(v)<1e-9&&orig)continue;s+=`<text x="${sx(v)}" y="${ax+(ax>T+H-1?20:16)}" text-anchor="middle">${fmt(v)}</text>`}
  if(ye)for(let i=0;y0+i*ys<=y1+1e-9;i++){if(i%ye)continue;const v=y0+i*ys;if(Math.abs(v)<1e-9&&orig)continue;s+=`<text x="${ay-8}" y="${sy(v)+4}" text-anchor="end">${fmt(v)}</text>`}
  if(orig&&(xe||ye))s+=`<text x="${ay-8}" y="${ax+16}" text-anchor="end">0</text>`;
  s+=`</g><g font-size="15" font-style="italic" fill="#111"><text x="${L+W+22}" y="${ax+5}">${esc($('#xl').value)}</text><text x="${ay}" y="${T-22}" text-anchor="middle">${esc($('#yl').value)}</text></g>`;
  if(ct)s+=`<text x="${L+W/2}" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">${esc(ct)}</text>`;
  if(xt)s+=`<text x="${L+W/2}" y="${T+H+52}" text-anchor="middle" font-size="14" fill="#111">${esc(xt)}</text>`;
  if(yt)s+=`<text transform="translate(16 ${T+H/2}) rotate(-90)" text-anchor="middle" font-size="14" fill="#111">${esc(yt)}</text>`;
  // rows
  const trace=f=>{const N=Math.max(600,Math.round(W)),segs=[];let cur=[],pp=null;
    for(let k=0;k<=N;k++){const x=x0+(x1-x0)*k/N,y=f(x);
      if(!isFinite(y)||Math.abs(y)>1e6){if(cur.length)segs.push(cur);cur=[];pp=null;continue}
      const p=[sx(x),sy(y)];if(pp&&Math.abs(p[1]-pp[1])>H*1.2){segs.push(cur);cur=[]}
      cur.push(p);pp=p}
    if(cur.length)segs.push(cur);return segs};
  let lines='',labels='',arrows='';
  const eqs=document.querySelectorAll('.eq');
  rows.forEach((r,i)=>{
    let p=null;
    try{p=parseRow(r.eq);eqs[i]&&eqs[i].classList.remove('bad')}catch(e){eqs[i]&&eqs[i].classList.add('bad');return}
    if(!p)return;
    const dash={solid:'',dashed:'stroke-dasharray="9 6"',dotted:'stroke-dasharray="1 6"'}[r.dash];
    const halo=`fill="${r.color}" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round"`;
    if(p.type=='pts'){
      const cs=r.lab?r.lab.split(';').map(z=>z.trim()):[];p.pts.forEach((q,qi)=>{if(r.vis!==false)lines+=`<circle cx="${sx(q.x)}" cy="${sy(q.y)}" r="4.5" fill="${r.color}" stroke="#fff" stroke-width="1"/>`;
        const t=(cs[qi]||q.n)+(r.coords?`(${fmt(q.x)}, ${fmt(q.y)})`:'');
        if(t&&r.labOn!==false){const[dx,dy,an]={above:[0,-11,'middle'],below:[0,ls+7,'middle'],on:[0,ls*.35,'middle'],right:[11,4,'start'],left:[-11,4,'end']}[r.place];labels+=`<text x="${(sx(q.x)+dx).toFixed(1)}" y="${(sy(q.y)+dy).toFixed(1)}" text-anchor="${an}" font-size="${ls}" font-weight="bold" ${halo}>${esc(t)}</text>`}});
      return}
    let segs;
    if(p.type=='v'){const n=80;segs=[[...Array(n+1)].map((_,k)=>[sx(p.c),sy(y0+(y1-y0)*k/n)])]}else segs=trace(p.f);
    if(r.vis!==false)lines+=`<path d="${segs.map(sg=>'M'+sg.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join('L')).join('')}" fill="none" stroke="${r.color}" stroke-width="${r.w}" stroke-linecap="round" stroke-linejoin="round" ${dash}/>`;
    const vis=segs.flat().filter(q=>q[0]>=L&&q[0]<=L+W&&q[1]>=T&&q[1]<=T+H);
    const arr=r.arr||'both';
    if(vis.length>1&&r.vis!==false){const hd=(q,a)=>{const ang=Math.atan2(q[1]-a[1],q[0]-a[0])*180/Math.PI,sz=9+r.w*1.5,hw=sz*.42;arrows+=`<polygon points="0,0 ${-sz},${-hw} ${-sz},${hw}" fill="${r.color}" transform="translate(${q[0].toFixed(1)} ${q[1].toFixed(1)}) rotate(${ang.toFixed(1)})"/>`};
      const n=vis.length;if(arr=='start'||arr=='both')hd(vis[0],vis[Math.min(4,n-1)]);if(arr=='end'||arr=='both')hd(vis[n-1],vis[Math.max(0,n-5)])}
    if(r.lab&&r.labOn!==false&&vis.length>1){
      const k=Math.round(r.pos/100*(vis.length-1)),q=vis[k],a=vis[Math.max(0,k-4)],b=vis[Math.min(vis.length-1,k+4)];
      let ang=r.rot?Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI:0;if(ang>90)ang-=180;if(ang<-90)ang+=180;
      const[dx,dy,an]={above:[0,-9,'middle'],below:[0,ls+3,'middle'],on:[0,ls*.35,'middle'],right:[11,4,'start'],left:[-11,4,'end']}[r.place];
      labels+=`<text transform="translate(${q[0].toFixed(1)} ${q[1].toFixed(1)}) rotate(${ang.toFixed(1)})" x="${dx}" y="${dy}" text-anchor="${an}" font-size="${ls}" font-weight="bold" ${halo}>${esc(r.lab)}</text>`}
  });
  s+=`<g clip-path="url(#cp)">${lines}</g>${arrows}${labels}</svg>`;
  fig.outerHTML=s}

// export
const svgStr=()=>new XMLSerializer().serializeToString($('#fig'));
const uri=()=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgStr());
const note=m=>$('#note').textContent=m;
function save(name,href){const a=document.createElement('a');a.href=href;a.download=name;document.body.appendChild(a);a.click();a.remove()}
function toPng(cb){const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),k=2;c.width=img.width*k;c.height=img.height*k;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);c.toBlob(cb)};img.onerror=()=>note('Could not build the image.');img.src=uri()}
$('#dsvg').onclick=()=>{try{save('coordinate-grid.svg',uri())}catch(e){note('Saving is blocked here. Open the page as a local file to save.')}};
$('#dpng').onclick=()=>{try{toPng(b=>save('coordinate-grid.png',URL.createObjectURL(b)))}catch(e){note('Saving is blocked here. Open the page as a local file to save.')}};
$('#cpy').onclick=()=>{try{toPng(async b=>{try{await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);note('Image copied.')}catch(e){note('Copying is blocked here. Use Save PNG from a local copy.')}})}catch(e){note('Copying is blocked here.')}};
$('#prt').onclick=()=>{try{window.print()}catch(e){note('Printing is blocked here.')}};

document.querySelectorAll('#panel input[id],#panel select[id]').forEach(el=>el.addEventListener('input',draw));
renderRows();draw();
</script>
</body>
